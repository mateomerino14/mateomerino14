name: Actualizar gráficos del perfil

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROFILE_LOGIN: ${{ github.repository_owner }}
      OUTPUT_DIR: dist
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Tarjetas de estadísticas, lenguajes y racha
        run: npm run cards -- "$OUTPUT_DIR"

      - name: Serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#4cc9f0&color_dots=#17181b,#2c3170,#4650b8,#7c86ff,#a5adff

      - name: Calendario de contribuciones en 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/profile-3d.json

      - name: Reunir imágenes
        run: cp profile-3d-contrib/profile-3d.svg "$OUTPUT_DIR/"

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: 'chore: Actualiza los gráficos del perfil'
